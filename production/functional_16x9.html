<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>功能性訓練 16:9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
html,body{margin:0;height:100%;background:#1b1612;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#A88D70}
#sv{position:absolute;inset:0;width:1920px;height:1080px}
#sub{position:absolute;left:140px;right:140px;bottom:44px;display:flex;justify-content:center;pointer-events:none}
#sub span{font:900 50px/1.42 "Noto Sans TC","PingFang TC",sans-serif;color:#fff;text-align:center;letter-spacing:1px;
  text-shadow:0 0 2px #120d0a,3px 3px 0 #120d0a,-3px -3px 0 #120d0a,3px -3px 0 #120d0a,-3px 3px 0 #120d0a,0 3px 0 #120d0a,0 -3px 0 #120d0a,3px 0 0 #120d0a,-3px 0 0 #120d0a,0 6px 14px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="stage">
  <svg id="sv" viewBox="0 0 1920 1080">
    <defs>
      <filter id="boil" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="-26" dy="-8" stdDeviation="5" flood-color="#33261b" flood-opacity="0.32"/>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="-14" dy="-4" stdDeviation="4" flood-color="#33261b" flood-opacity="0.28"/>
      </filter>
      <radialGradient id="glow"><stop offset="0" stop-color="#FFF4C2" stop-opacity=".95"/><stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/></radialGradient>
    </defs>
    <image id="bg" x="0" y="0" width="1920" height="1080" preserveAspectRatio="none"/>
    <g id="world" filter="url(#boil)"></g>
  </svg>
  <div id="sub"><span></span></div>
</div>
<script src="timing.js"></script>
<script>
/* ───────── 工具 ───────── */
const NS = 'http://www.w3.org/2000/svg', INK = '#2B231D', FLOOR = 880;
const HAND = '"LXGW WenKai TC","Kaiti TC","STKaiti",serif';
const TIMING = window.TIMING, SUBS = window.SUBS, TOTAL = TIMING[TIMING.length - 1].end;
const byId = Object.fromEntries(TIMING.map(t => [t.id, t]));
function E(tag, a = {}, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const out3 = p => 1 - Math.pow(1 - p, 3);
const inout = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const sine = p => 0.5 - 0.5 * Math.cos(Math.PI * p);
const back = p => { const c = 1.7, d = p - 1; return 1 + (c + 1) * d * d * d + c * d * d; };
const rnd = (() => { let s = 7; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ───────── 牆面質感（像參考影片那種刮痕牆） ───────── */
function makeWall() {
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, '#BCA284'); gr.addColorStop(.75, '#AE9373'); gr.addColorStop(1, '#9A8064');
  g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  for (let i = 0; i < 700; i++) {
    const x = rnd() * 1920, y = rnd() * 1080, r = 30 + rnd() * 170, dark = rnd() < .55;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, dark ? 'rgba(70,48,30,.07)' : 'rgba(240,225,200,.07)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 7000; i++) {
    const x = rnd() * 1920, y = rnd() * 1080, l = 4 + rnd() * 46, a = (rnd() - .5) * .9 + (rnd() < .3 ? 1.4 : 0);
    g.strokeStyle = rnd() < .6 ? `rgba(60,40,24,${.04 + rnd() * .09})` : `rgba(255,245,225,${.04 + rnd() * .08})`;
    g.lineWidth = .6 + rnd() * 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // 地板
  const fg = g.createLinearGradient(0, FLOOR, 0, 1080); fg.addColorStop(0, 'rgba(70,50,34,.30)'); fg.addColorStop(1, 'rgba(50,34,22,.48)');
  g.fillStyle = fg; g.fillRect(0, FLOOR, 1920, 1080 - FLOOR);
  g.strokeStyle = 'rgba(45,30,20,.55)'; g.lineWidth = 3; g.beginPath();
  for (let x = 0; x <= 1920; x += 20) g.lineTo(x, FLOOR + Math.sin(x * .013) * 2 + (rnd() - .5) * 1.5); g.stroke();
  const vg = g.createRadialGradient(960, 520, 300, 960, 540, 1150); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,24,12,.42)');
  g.fillStyle = vg; g.fillRect(0, 0, 1920, 1080);
  document.getElementById('bg').setAttribute('href', c.toDataURL('image/jpeg', .92));
}

/* ───────── 出場動畫登記 ───────── */
const ITEMS = [], CUES = [];
// R：一個會在 t0 出現、t1 消失的元素群組（位置 x,y；kind: pop/up/fade/drop/left/right/write）
function R(parent, x, y, t0, t1 = 1e9, kind = 'pop', sfx = 'pop', rot = 0) {
  const outer = E('g', {transform: `translate(${x} ${y}) rotate(${rot})`}, parent);
  const g = E('g', {opacity: 0}, outer);
  ITEMS.push({g, t0, t1, kind});
  if (sfx) CUES.push({t: t0, type: sfx});
  return g;
}
function updItem(it, t) {
  const p = clamp((t - it.t0) / .45), q = clamp((it.t1 - t) / .35);
  const o = Math.min(it.kind === 'pop' ? clamp(p * 3) : out3(p), q);
  let tr = '';
  if (it.kind === 'pop') tr = `scale(${p <= 0 ? .3 : .3 + .7 * back(p)})`;
  else if (it.kind === 'up') tr = `translate(0 ${(1 - out3(p)) * 40})`;
  else if (it.kind === 'drop') tr = `translate(0 ${(1 - out3(p)) * -60})`;
  else if (it.kind === 'left') tr = `translate(${(1 - out3(p)) * -120} 0)`;
  else if (it.kind === 'right') tr = `translate(${(1 - out3(p)) * 120} 0)`;
  it.g.setAttribute('opacity', o.toFixed(3));
  it.g.setAttribute('transform', tr);
}
// 手寫字
function HW(p, x, y, text, size = 56, fill = INK, anchor = 'start', w = 700) {
  const e = E('text', {x, y, 'font-family': HAND, 'font-size': size, 'font-weight': w, fill, 'text-anchor': anchor, 'dominant-baseline': 'middle'}, p);
  e.textContent = text; return e;
}
function brush(p, x1, y, x2, col = '#C9573A', w = 10) {
  let d = `M${x1},${y}`; for (let x = x1; x <= x2; x += 30) d += ` L${x},${y + Math.sin(x * .07) * 3}`;
  return E('path', {d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', opacity: .85}, p);
}
function paper(p, w, h, title, lines = [], o = {}) {
  E('rect', {x: -w / 2, y: -h / 2, width: w, height: h, rx: 10, fill: o.fill || '#F3E8CF', stroke: INK, 'stroke-width': 4}, p);
  E('rect', {x: -60, y: -h / 2 - 16, width: 120, height: 32, fill: 'rgba(235,220,170,.85)', stroke: 'rgba(43,35,29,.35)', 'stroke-width': 2, transform: 'rotate(-3)'}, p);
  if (title) HW(p, 0, -h / 2 + 56, title, o.ts || 52, o.tc || INK, 'middle');
  lines.forEach((l, i) => HW(p, 0, -h / 2 + (o.ly || 140) + i * (o.lh || 64), l[0], l[1] || 44, l[2] || INK, 'middle'));
}

/* ───────── 角色：側面、可做坐站撿物的 IK 人偶 ───────── */
function ik2(ax, ay, tx, ty, l1, l2, side) {
  const dx = tx - ax, dy = ty - ay;
  const d = clamp(Math.hypot(dx, dy) || .01, Math.abs(l1 - l2) + .01, l1 + l2 - .01);
  const ang = Math.atan2(dy, dx), a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const ja = ang + side * a;
  return [ax + l1 * Math.cos(ja), ay + l1 * Math.sin(ja), ax + d * Math.cos(ang), ay + d * Math.sin(ang)];
}
const KINDS = {
  bear: {L1: 116, L2: 110, AH: 16, TR: 160, legW: 50, UA: 90, FA: 84, armW: 32, shX: 6},
  fox: {L1: 110, L2: 114, AH: 16, TR: 146, legW: 32, UA: 86, FA: 82, armW: 22, shX: 4},
};
class Critter {
  constructor(parent, o = {}) {
    this.o = Object.assign({kind: 'bear', s: 1, face: 1, fur: '#E3A04B', fur2: '#F5D296', shirt: '#33375C', pants: '#8C7A5C', shoe: '#3A2C24', glasses: false, brows: false, badge: false, hold: null}, o);
    const k = this.k = KINDS[this.o.kind], o2 = this.o;
    this.g = E('g', {filter: 'url(#shadow)'}, parent);
    const g = this.g;
    const limb = (w, col) => {
      const grp = E('g', {}, g);
      return {grp, a: E('path', {fill: 'none', stroke: INK, 'stroke-width': w + 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, grp),
        b: E('path', {fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, grp)};
    };
    const shoe = () => { const s = E('g', {}, g); E('path', {d: `M-16,-8 C-18,8 -12,${k.AH} 0,${k.AH} L46,${k.AH} C60,${k.AH} 62,2 46,-4 C30,-10 6,-14 -16,-8 Z`, fill: o2.shoe, stroke: INK, 'stroke-width': 4}, s); return s; };
    const hand = (col) => { const h = E('g', {}, g); E('circle', {r: k.armW * .62, fill: col, stroke: INK, 'stroke-width': 4}, h); return h; };
    // 後側手、腳（較暗）
    this.armB = limb(k.armW, shade(o2.fur, -.15)); this.slvB = limb(k.armW + 8, shade(o2.shirt, -.2)); this.handB = hand(shade(o2.fur, -.15));
    this.legB = limb(k.legW, shade(o2.pants, -.18)); this.shoeB = shoe();
    if (this.o.kind === 'fox') {
      this.tail = E('g', {}, g);
      E('path', {d: 'M-34,-26 C-92,-36 -134,4 -124,54 C-114,86 -70,66 -60,34 C-54,12 -44,-8 -34,-26 Z', fill: o2.fur, stroke: INK, 'stroke-width': 4}, this.tail);
      E('path', {d: 'M-124,54 C-118,80 -86,78 -76,58 C-92,64 -112,62 -124,54 Z', fill: '#FFF8EC', stroke: INK, 'stroke-width': 3}, this.tail);
    }
    // 軀幹＋頭
    this.trunkG = E('g', {}, g);
    const T = this.trunkG;
    if (o2.kind === 'bear') {
      E('path', {d: 'M-58,14 C-76,-52 -70,-118 -42,-158 C-20,-170 22,-170 40,-156 C76,-118 92,-52 74,6 C62,26 -44,30 -58,14 Z', fill: o2.shirt, stroke: INK, 'stroke-width': 4.5}, T);
      E('path', {d: 'M-60,2 C-40,20 58,20 76,-4 L77,14 C60,32 -48,34 -60,18 Z', fill: o2.pants, stroke: INK, 'stroke-width': 4}, T);
      E('path', {d: 'M8,-158 C18,-140 30,-134 44,-140', fill: 'none', stroke: INK, 'stroke-width': 3.5}, T);
    } else {
      E('path', {d: 'M-40,12 C-50,-46 -46,-104 -26,-142 C-12,-152 16,-152 28,-140 C48,-104 54,-46 46,6 C36,22 -30,24 -40,12 Z', fill: o2.shirt, stroke: INK, 'stroke-width': 4.5}, T);
      E('path', {d: 'M-41,2 C-24,16 30,16 47,-2 L48,12 C34,26 -30,28 -41,16 Z', fill: o2.pants, stroke: INK, 'stroke-width': 4}, T);
      if (o2.badge) {
        E('path', {d: 'M2,-146 L22,-96 M14,-146 L24,-96', stroke: '#028090', 'stroke-width': 4, fill: 'none'}, T);
        E('rect', {x: 12, y: -100, width: 26, height: 32, rx: 4, fill: '#FFFFFF', stroke: INK, 'stroke-width': 3}, T);
        E('rect', {x: 16, y: -94, width: 18, height: 6, fill: '#028090'}, T);
      }
    }
    this.headG = E('g', {}, T);
    const H = this.headG;
    if (o2.kind === 'bear') {
      for (const [x, y, r] of [[-34, -108, 20], [20, -114, 18]]) { E('circle', {cx: x, cy: y, r, fill: o2.fur, stroke: INK, 'stroke-width': 4}, H); E('circle', {cx: x, cy: y, r: r * .45, fill: shade(o2.fur, -.25)}, H); }
      E('ellipse', {cx: 6, cy: -58, rx: 64, ry: 60, fill: o2.fur, stroke: INK, 'stroke-width': 4.5}, H);
      E('ellipse', {cx: 54, cy: -44, rx: 32, ry: 24, fill: o2.fur2, stroke: INK, 'stroke-width': 4}, H);
      E('ellipse', {cx: 82, cy: -52, rx: 10, ry: 8, fill: INK}, H);
      this.eye = E('ellipse', {cx: 34, cy: -74, rx: 5, ry: 7, fill: INK}, H);
      if (o2.brows) { E('path', {d: 'M20,-94 q13,-10 28,-3', stroke: INK, 'stroke-width': 12, 'stroke-linecap': 'round', fill: 'none'}, H); E('path', {d: 'M20,-94 q13,-10 28,-3', stroke: '#F6F1E6', 'stroke-width': 7, 'stroke-linecap': 'round', fill: 'none'}, H); }
      if (o2.glasses) { E('circle', {cx: 36, cy: -72, r: 15, fill: 'rgba(255,255,255,.18)', stroke: INK, 'stroke-width': 3.5}, H); E('path', {d: 'M21,-74 L-4,-80', stroke: INK, 'stroke-width': 3.5}, H); }
      if (o2.bow) { E('path', {d: 'M-30,-118 l-20,-16 l0,30 z M-30,-118 l20,-16 l0,30 z', fill: o2.bow, stroke: INK, 'stroke-width': 3}, H); }
      this.mouth = E('path', {d: 'M58,-26 q9,6 18,-2', stroke: INK, 'stroke-width': 3.5, fill: 'none', 'stroke-linecap': 'round'}, H);
    } else {
      E('path', {d: 'M-30,-62 L-24,-120 L2,-78 Z', fill: o2.fur, stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round'}, H);
      E('path', {d: 'M-6,-70 L8,-126 L26,-76 Z', fill: o2.fur, stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round'}, H);
      E('path', {d: 'M-1,-76 L7,-110 L17,-78 Z', fill: '#FBEFE0'}, H);
      E('ellipse', {cx: 4, cy: -44, rx: 44, ry: 42, fill: o2.fur, stroke: INK, 'stroke-width': 4.5}, H);
      E('path', {d: 'M20,-64 C50,-58 78,-46 92,-40 C78,-30 50,-22 20,-20 Z', fill: o2.fur, stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round'}, H);
      E('path', {d: 'M24,-34 C48,-32 70,-34 90,-38 C76,-26 50,-20 24,-22 Z', fill: '#FFF8EC', stroke: INK, 'stroke-width': 3}, H);
      E('path', {d: 'M-12,-30 C2,-10 24,-12 30,-24 C18,-22 2,-24 -12,-30 Z', fill: '#FFF8EC', stroke: INK, 'stroke-width': 3}, H);
      E('circle', {cx: 92, cy: -40, r: 6.5, fill: INK}, H);
      this.eye = E('ellipse', {cx: 30, cy: -58, rx: 4.5, ry: 6.5, fill: INK}, H);
      this.mouth = E('path', {d: 'M60,-28 q8,4 16,0', stroke: INK, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round'}, H);
    }
    // 前側腳、手
    this.legF = limb(k.legW, o2.pants); this.shoeF = shoe();
    this.armF = limb(k.armW, o2.fur); this.slvF = limb(k.armW + 8, o2.shirt); this.handF = hand(o2.fur);
    this.prop = E('g', {}, g);   // 手上拿的東西（鑰匙等）
  }
  // P: {x,y 髖關節世界座標, trunk 前傾角, head, feet:[[x,y],[x,y]] 腳踝世界座標, heel:[角度,角度], hands:[[x,y]|null,…], o, face, mood}
  pose(P) {
    const k = this.k, s = this.o.s, face = P.face ?? this.o.face;
    this.g.setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)}) scale(${(face * s).toFixed(4)} ${s.toFixed(4)})`);
    this.g.setAttribute('opacity', (P.o ?? 1).toFixed(3));
    const L = w => [(w[0] - P.x) * face / s, (w[1] - P.y) / s];
    const tr = P.trunk || 0, th = tr * Math.PI / 180;
    this.trunkG.setAttribute('transform', `rotate(${tr.toFixed(2)})`);
    this.headG.setAttribute('transform', `translate(${k.shX + 8} ${-k.TR + 4}) rotate(${(P.head || 0).toFixed(2)})`);
    if (this.tail) this.tail.setAttribute('transform', `rotate(${(P.tail || 0).toFixed(2)} -34 -26)`);
    const shx = k.shX * Math.cos(th) + (k.TR - 16) * Math.sin(th), shy = k.shX * Math.sin(th) - (k.TR - 16) * Math.cos(th);
    const legs = [[this.legF, this.shoeF], [this.legB, this.shoeB]];
    legs.forEach(([leg, sh], i) => {
      const [ax, ay] = L(P.feet[i]);
      const [kx, ky, ex, ey] = ik2(0, 0, ax, ay, k.L1, k.L2, -1);
      const d = `M0,0 L${kx.toFixed(1)},${ky.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)}`;
      leg.a.setAttribute('d', d); leg.b.setAttribute('d', d);
      const hl = (P.heel && P.heel[i]) || 0, fa = (P.footAng && P.footAng[i]) || 0;
      sh.setAttribute('transform', `translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${(hl + fa).toFixed(2)})`);
    });
    const arms = [[this.armF, this.slvF, this.handF], [this.armB, this.slvB, this.handB]];
    arms.forEach(([arm, slv, hd], i) => {
      const off = i ? -8 : 0;
      const tg = P.hands && P.hands[i] ? L(P.hands[i]) : [shx + 12 + off, shy + k.UA + k.FA - 16];
      const [ex, ey, hx, hy] = ik2(shx + off, shy, tg[0], tg[1], k.UA, k.FA, 1);
      const d = `M${(shx + off).toFixed(1)},${shy.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)} L${hx.toFixed(1)},${hy.toFixed(1)}`;
      arm.a.setAttribute('d', d); arm.b.setAttribute('d', d);
      const mx = lerp(shx + off, ex, .5), my = lerp(shy, ey, .5);
      const sd = `M${(shx + off).toFixed(1)},${shy.toFixed(1)} L${mx.toFixed(1)},${my.toFixed(1)}`;
      slv.a.setAttribute('d', sd); slv.b.setAttribute('d', sd);
      hd.setAttribute('transform', `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
      if (i === 0) this.prop.setAttribute('transform', `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
    });
    const bl = P.blink ? .15 : 1;
    this.eye.setAttribute('transform', `translate(0 ${this.o.kind === 'bear' ? -74 : -58}) scale(1 ${bl}) translate(0 ${this.o.kind === 'bear' ? 74 : 58})`);
    if (P.mood === 'sad') this.mouth.setAttribute('d', this.o.kind === 'bear' ? 'M58,-22 q9,-6 18,2' : 'M60,-26 q8,-4 16,2');
    else this.mouth.setAttribute('d', this.o.kind === 'bear' ? 'M58,-26 q9,6 18,-2' : 'M60,-28 q8,4 16,0');
  }
  // 常用尺寸（世界座標）
  get standY() { const k = this.k; return FLOOR - (k.L1 + k.L2 - 3 + k.AH) * this.o.s; }
  get ankleY() { return FLOOR - this.k.AH * this.o.s; }
  seatY() { return FLOOR - (this.k.L2 + this.k.AH + 4) * this.o.s; }
}
const blinkAt = t => (t % 3.7) < .12;

// 姿勢產生器（面向右）
function standP(c, x, extra = {}) {
  const s = c.o.s;
  return Object.assign({x, y: c.standY, trunk: 0, feet: [[x + 8 * s, c.ankleY], [x - 4 * s, c.ankleY]]}, extra);
}
function sitP(c, sx, sy, extra = {}) {
  const s = c.o.s, k = c.k, hy = sy - 6 * s;
  const fx = sx + (k.L1 + 4) * s;
  return Object.assign({x: sx, y: hy, trunk: -3, feet: [[fx, c.ankleY], [fx - 10 * s, c.ankleY]],
    hands: [[sx + (k.L1 * .7) * s, hy - 14 * s], [sx + (k.L1 * .6) * s, hy - 16 * s]]}, extra);
}
// 坐到站 p: 0 坐 → 1 站
function sts(c, sx, sy, p, extra = {}) {
  const s = c.o.s, k = c.k, hy = sy - 6 * s;
  const f0 = sx + (k.L1 + 4) * s, f1 = sx + (k.L1 - 30) * s;

// s3 重點一：防跌，站著練
scene('s3', (g, T, A, P) => {

});

/* ───────── 主繪製 ───────── */
const subEl = document.querySelector('#sub span'), turb = document.getElementById('turb');
const ctx2d = document.createElement('canvas').getContext('2d');
const textW = s => { ctx2d.font = '900 50px "Noto Sans TC","PingFang TC",sans-serif'; return ctx2d.measureText(s).width; };
function subHTML(text) {
  const s = text.replace(/[，。；、：]$/, '');
  if (textW(s) <= 1560) return s;
  const cut = [...s].map((c, i) => '，、；：'.includes(c) ? i + 1 : 0).filter(i => i > 2 && i < s.length - 2);
  let best = null;
  cut.forEach(a => { const ls = [s.slice(0, a), s.slice(a)], m = Math.max(...ls.map(textW)); if (!best || m < best.m) best = {ls, m}; });
  return best ? best.ls.join('<br>') : s;
}
let curSub = null;
function render(t) {
  turb.setAttribute('seed', 1 + Math.floor(t * 8) % 7);
  SC.forEach(s => {
    const fin = s.a === 0 ? 1 : clamp((t - s.a) / .35), fout = s.last ? 1 : clamp((s.b - t) / .3);
    const o = Math.min(fin, fout);
    s.g.setAttribute('opacity', o.toFixed(3));
    s.g.style.visibility = o > 0 ? 'visible' : 'hidden';
    if (o > 0) s.draw(t);
  });
  ITEMS.forEach(it => updItem(it, t));
  let sb = null;
  for (const x of SUBS) if (t >= x.a && t < x.b) { sb = x; break; }
  if (sb !== curSub) { curSub = sb; subEl.innerHTML = sb ? subHTML(sb.text) : ''; }
  subEl.style.opacity = sb ? clamp(Math.min((t - sb.a) / .12, (sb.b - t) / .12)) : 0;
}
window.render = render; window.TOTAL = TOTAL;
window.cues = () => {
  const c = SC.slice(1).map(s => ({t: s.a - .15, type: 'whoosh'})).concat(CUES.filter(x => x.t < TOTAL));
  return c.sort((a, b) => a.t - b.t);
};
makeWall();
const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
if (!/render=1/.test(location.search)) {
  const audio = new Audio('narration_mix.m4a');
  let t = +(new URLSearchParams(location.search).get('t') || 0), last = performance.now(), paused = true;
  const sync = () => { try { audio.currentTime = t; if (!paused) audio.play().catch(() => {}); else audio.pause(); } catch (e) {} };
  const loop = now => { if (!paused) t = Math.min(TOTAL, t + (now - last) / 1000); last = now; render(t); requestAnimationFrame(loop); };
  addEventListener('click', () => { paused = !paused; sync(); });
  addEventListener('keydown', e => { if (e.code === 'Space') paused = !paused; if (e.key === 'ArrowRight') t = Math.min(TOTAL, t + 5); if (e.key === 'ArrowLeft') t = Math.max(0, t - 5); sync(); });
  requestAnimationFrame(loop);
} else render(0);
